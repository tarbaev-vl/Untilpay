services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: budget
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no port is published: the database is reachable only by the app

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://budget:${POSTGRES_PASSWORD}@db:5432/budget
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (32+ characters)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # "Budget advice": the LLM and its key (see README → AI advice); empty — the advice panel is off
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_KEY: ${LLM_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # Bank sync through Enable Banking (see README → Bank sync); empty EB_APP_ID — bank sync is off
      EB_APP_ID: ${EB_APP_ID:-}
      EB_PRIVATE_KEY_FILE: ${EB_PRIVATE_KEY_FILE:-/run/secrets/enablebanking.pem}
      EB_REDIRECT_URL: ${EB_REDIRECT_URL:-}
    volumes:
      # the Enable Banking private key lives here, outside the repository
      - ./secrets:/run/secrets:ro
    extra_hosts:
      # lets the container reach Ollama running on the host (LLM_PROVIDER=ollama)
      - "host.docker.internal:host-gateway"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Cloudflare Tunnel: access from the internet over HTTPS without opening ports (see README → Access from outside).
  # Off by default; turn on with COMPOSE_PROFILES=tunnel and CLOUDFLARE_TUNNEL_TOKEN in .env.
  # In the Cloudflare dashboard point the tunnel's public hostname to http://web:81
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel --no-autoupdate run
    environment:
      # the token is read from the environment so that it does not show up in the process list
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  pgdata:
