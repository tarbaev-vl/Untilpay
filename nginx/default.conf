upstream untilpay_app {
  server app:3000;
  keepalive 16;
}

# Port 80 is published for the local network; port 81 is not published and is used only by the
# Cloudflare Tunnel container. Only there the client IP from Cloudflare is trusted and the scheme is https.
map $http_cf_connecting_ip $cf_client_ip {
  ''      $remote_addr;
  default $http_cf_connecting_ip;
}
map $server_port $client_ip {
  81      $cf_client_ip;
  default $remote_addr;
}
map $server_port $client_proto {
  81      https;
  default $scheme;
}

server {
  listen 80;
  listen 81;
  server_name _;

  client_max_body_size 2m; # CSV statement import
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json text/csv;
  gzip_min_length 512;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # X-Forwarded-For is replaced, not appended: the app trusts it for rate limiting,
  # so a client must not be able to put its own value there
  location / {
    proxy_pass http://untilpay_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $client_proto;
  }

  # AI advice: the model reply may take longer than the default 60 seconds
  location /api/insights {
    proxy_pass http://untilpay_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_read_timeout 180s;
  }

  # the browser revalidates static files by ETag (304), so it picks up the new version right after a rebuild
  location ~* \.(css|js)$ {
    proxy_pass http://untilpay_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'" always;
  }
}
